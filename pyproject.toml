[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lidar-label-tool"
version = "0.4.0"
description = "Profile-based single-LiDAR 3D box labeling with optional camera views"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.20",
  "numpy>=1.26",
  "Pillow>=10"
]

[project.optional-dependencies]
gui = [
  "PySide6>=6.8,<7",
  "pyqtgraph>=0.13,<0.15",
  "PyOpenGL>=3.1"
]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
lidar-label-tool = "lidar_label_tool.app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/lidar-label-tool/configs" = ["configs/default.json"]
"share/lidar-label-tool/schemas" = ["schemas/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
